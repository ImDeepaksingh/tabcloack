<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabCloak</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07070c;
      --surface: rgba(255,255,255,0.035);
      --surface-hover: rgba(255,255,255,0.055);
      --border: rgba(255,255,255,0.07);
      --border-focus: rgba(111,88,255,0.5);
      --text: #f0eeff;
      --text-muted: rgba(240,238,255,0.35);
      --text-dim: rgba(240,238,255,0.18);
      --accent: #6f58ff;
      --accent-glow: rgba(111,88,255,0.25);
      --green: #10b981;
      --red: #ef4444;
      --orange: #f97316;
      --yellow: #eab308;
    }

    html, body {
      width: 380px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(111,88,255,0.05) 0%, transparent 100%);
    }
    .header-icon { font-size: 22px; line-height: 1; }
    .header-text { flex: 1; }
    .header-title { font-size: 16px; font-weight: 700; letter-spacing: -0.4px; }
    .header-tagline { font-size: 10px; color: var(--text-muted); font-weight: 400; margin-top: 1px; }

    .tab-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
    }
    .tab-indicator.locked { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.2); color: var(--red); }
    .tab-indicator.unlocked { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.2); color: var(--green); }
    .tab-indicator::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ── Sections ── */
    .section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .section-label .count {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 9px;
      color: var(--text-dim);
    }

    /* ── Current Tab Card ── */
    .tab-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .tab-card-favicon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      border-radius: 4px;
    }
    .tab-card-favicon-placeholder {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      background: var(--accent-glow);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    .tab-card-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    /* ── Form Fields ── */
    .field { margin-bottom: 10px; }
    .field label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
      letter-spacing: 0.2px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      resize: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--border-focus);
      background: rgba(111,88,255,0.04);
    }
    .field select { cursor: pointer; }
    .field select option { background: #111118; color: var(--text); }
    .field textarea { min-height: 60px; font-size: 12px; line-height: 1.5; }

    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 42px; }
    .eye-btn {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      background: none; border: none; padding: 0; cursor: pointer;
      color: var(--text-dim); font-size: 15px; line-height: 1;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--text-muted); }

    /* Strength */
    .strength-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
    .strength-bars { display: flex; gap: 3px; flex: 1; }
    .strength-bar {
      height: 3px; flex: 1; border-radius: 2px;
      background: var(--border);
      transition: background 0.3s;
    }
    .strength-text { font-size: 10px; color: var(--text-dim); width: 38px; text-align: right; }

    /* ── Buttons ── */
    .btn {
      display: block; width: 100%; padding: 11px 16px;
      border-radius: 10px; border: none;
      font-size: 13px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: all 0.2s; letter-spacing: 0.02em;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #a855f7);
      color: #fff;
      box-shadow: 0 4px 16px rgba(111,88,255,0.3);
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(111,88,255,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-ghost {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover { background: var(--surface-hover); color: var(--text); border-color: rgba(255,255,255,0.12); }

    .btn-danger {
      background: rgba(239,68,68,0.08);
      border: 1.5px solid rgba(239,68,68,0.2);
      color: var(--red);
    }
    .btn-danger:hover { background: rgba(239,68,68,0.15); }

    .btn-sm { padding: 5px 11px; font-size: 11px; border-radius: 7px; width: auto; display: inline-block; }
    .btn-gap { margin-top: 8px; }

    /* ── Locked Tabs List ── */
    .locked-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 6px;
      transition: background 0.2s;
    }
    .locked-item:hover { background: var(--surface-hover); }
    .locked-item-icon { font-size: 18px; flex-shrink: 0; }
    .locked-item-info { flex: 1; overflow: hidden; }
    .locked-item-title {
      font-size: 12px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--text);
    }
    .locked-item-disguise { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }
    .locked-item-actions { display: flex; gap: 5px; flex-shrink: 0; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 24px 20px;
      color: var(--text-dim);
    }
    .empty .empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.6; }
    .empty p { font-size: 12px; }

    /* Status toast */
    .toast {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: rgba(16,185,129,0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
    .toast.error { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }

    /* ── Settings Panel ── */
    .settings-toggle {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; padding: 4px 0; user-select: none;
    }
    .settings-toggle .chevron { font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
    .settings-panel { display: none; padding-top: 14px; }
    .settings-panel.open { display: block; }
    .settings-toggle.open .chevron { transform: rotate(180deg); }

    /* ── Footer ── */
    .footer {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.015);
    }
    .shortcut-tip {
      display: flex; align-items: center; gap: 4px;
      font-size: 10px; color: var(--text-dim);
    }
    kbd {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 9.5px;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
    }
    .nuclear-tip {
      font-size: 9.5px;
      color: rgba(239,68,68,0.35);
      display: flex; align-items: center; gap: 4px;
    }
    .nuclear-tip::before { content: '☢'; font-size: 10px; }

    /* Divider */
    .divider { height: 1px; background: var(--border); margin: 12px 0; }

    /* Hidden */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <div class="header">
    <div class="header-icon">🔒</div>
    <div class="header-text">
      <div class="header-title">TabCloak</div>
      <div class="header-tagline">Tab privacy & disguise</div>
    </div>
    <div id="tab-status-badge" class="tab-indicator unlocked">Unlocked</div>
  </div>

  <!-- ── Current Tab ── -->
  <div class="section" id="section-current">
    <div class="section-label">Current Tab</div>

    <div class="tab-card">
      <div id="tab-favicon-wrap">
        <div class="tab-card-favicon-placeholder">🌐</div>
      </div>
      <div id="tab-title" class="tab-card-title">Loading…</div>
    </div>

    <div id="lock-form">
      <div class="field">
        <label>Mode</label>
        <select id="lock-mode-select">
          <option value="password">🔒 Password Lock (Secure)</option>
          <option value="disguise">🎭 Google Disguise (No Password)</option>
        </select>
      </div>

      <div class="field">
        <label>Disguise tab title as</label>
        <input type="text" id="disguise-title" placeholder="e.g. Google, Outlook, New Tab…" value="New Tab">
      </div>

      <div class="field" id="password-field-group">
        <label>Password</label>
        <div class="pwd-wrap">
          <input type="password" id="lock-password" placeholder="Set a strong password…" autocomplete="off">
          <button class="eye-btn" id="eye-lock" title="Toggle visibility">👁</button>
        </div>
        <div class="strength-row">
          <div class="strength-bars">
            <div class="strength-bar" id="sb1"></div>
            <div class="strength-bar" id="sb2"></div>
            <div class="strength-bar" id="sb3"></div>
            <div class="strength-bar" id="sb4"></div>
          </div>
          <div class="strength-text" id="strength-label">—</div>
        </div>
      </div>

      <div class="field">
        <label>Auto-lock behavior</label>
        <select id="auto-lock-select">
          <option value="1">Always lock on tab switch (recommended)</option>
          <option value="5">Lock after 5 minutes away</option>
          <option value="15">Lock after 15 minutes away</option>
          <option value="30">Lock after 30 minutes away</option>
          <option value="0">Never auto-relock (unlock once)</option>
        </select>
      </div>

      <!-- Advanced toggle -->
      <div class="settings-toggle" id="adv-toggle">
        <span style="font-size:11px; color: var(--text-muted); font-weight:500;">⚙ Advanced options</span>
        <span class="chevron">▼</span>
      </div>
      <div class="settings-panel" id="adv-panel">
        <div class="field">
          <label>Private note (visible after unlock)</label>
          <textarea id="lock-note" placeholder="Optional reminder or hint for yourself…" rows="2"></textarea>
        </div>
      </div>

      <div class="divider"></div>
      <button class="btn btn-primary" id="lock-btn">🔒  Lock This Tab</button>
    </div>

    <div id="unlock-form" class="hidden">
      <div id="unlock-pwd-group">
        <div class="field">
          <label>Unlock with password</label>
          <div class="pwd-wrap">
            <input type="password" id="unlock-password" placeholder="Enter password…" autocomplete="off">
            <button class="eye-btn" id="eye-unlock" title="Toggle visibility">👁</button>
          </div>
        </div>
        <button class="btn btn-primary" id="unlock-btn">🔓  Unlock Tab</button>
      </div>
      <button class="btn btn-danger btn-gap" id="force-unlock-btn" style="margin-top: 10px;">Remove Lock</button>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <!-- ── All Locked Tabs ── -->
  <div class="section" id="section-locked">
    <div class="section-label">
      All Locked Tabs
      <span class="count" id="locked-count">0</span>
    </div>
    <div id="locked-list">
      <div class="empty">
        <div class="empty-icon">🛡️</div>
        <p>No locked tabs yet.<br>Lock this tab to get started.</p>
      </div>
    </div>
  </div>

  <!-- ── Footer ── -->
  <div class="footer">
    <div class="shortcut-tip">
      Panic lock: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd>
    </div>
    <div class="nuclear-tip">Disable = all tabs close</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
